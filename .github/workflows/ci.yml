name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Workshop validation (structure, regressions, secrets)
        run: python3 scripts/validate_workshop.py

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/lakebase-lab-console
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run backend tests
        run: pytest -q

      - name: Dependency audit (non-blocking)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || true

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/lakebase-lab-console/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install, test, and build
        run: |
          npm ci
          npm test
          npm run build

      - name: Dependency audit (non-blocking)
        run: npm audit --omit=dev || true
